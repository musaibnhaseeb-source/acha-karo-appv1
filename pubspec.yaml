name: acha_karo
description: "Acha Karo — do good, get seen."
publish_to: 'none'
version: 1.3.2+8                # user-facing "v1.3.2" — keep kAppVersionLabel in lib/utils/app_version.dart in sync

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1       # Fraunces / Inter / IBM Plex Mono / Noto Nastaliq Urdu
  image_picker: ^1.1.2       # native camera capture for photo-mode deed submissions
  geolocator: ^12.0.0        # native GPS capture (photo mode flagging logic)
  provider: ^6.1.2           # app-wide state, analogous to the useAppState() hook in the Next.js port
  supabase_flutter: ^2.5.0  # if flutter pub get fails mentioning "publishableKey" instead of
                             # "anonKey", that's Supabase's own recent parameter rename — one
                             # line to fix in lib/main.dart, tell me and I'll adjust it
  url_launcher: ^6.3.0      # opens campaign YouTube videos externally — youtube_player_flutter
                             # (in-app playback) was removed: it depends on flutter_inappwebview,
                             # which has a currently-unresolved upstream bug breaking the Android
                             # build entirely on newer build tools. Not worth the risk for MVP.
  gal: ^2.3.0                # New — real "save to device gallery" for sticker downloads. This is
                             # a genuinely new capability, not something achievable with what was
                             # already in the project — no built-in Dart/Flutter way to write to
                             # the platform's media gallery exists without real native code,
                             # which is what this package provides. Worth extra care on first
                             # real test, same as every other "first" package in this project.
  shared_preferences: ^2.5.5 # local-only "onboarding tour seen" flag. Already bundled (supabase_flutter
                             # depends on it for session storage) — this just makes it a direct dependency.
  flutter_local_notifications: ^17.2.3  # system notifications + the local daily Guddi reminder, and the
                                        # Android 13+ notification-permission request. Was wrongly under
                                        # dev_dependencies, which recent Flutter strips from release builds
                                        # (so notifications were silently dead in release APKs).
  timezone: ^0.9.4          # scheduled-notification dates (already pulled in by flutter_local_notifications)
  crypto: ^3.0.0              # SHA-256 of cleaned deed photos: duplicate-photo check (already a transitive dependency)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  image_picker_platform_interface: ^2.11.1  # tests only: fake picker for the submit-form widget test
  flutter_launcher_icons: ^0.13.1  # generates every required icon size from one image you provide
  flutter_native_splash: ^2.4.1    # generates the real native launch screen (background color +
                                     # logo) from the config below — replaces Flutter's default
                                     # white screen shown before Flutter itself has loaded

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#081209"          # matches AppColors.bg1 — same dark background the app itself uses,
                             # not the default white
  image: "assets/splash/logo.png"
  android_12:                # Android 12+ uses a different splash API, needs its own config —
    color: "#081209"         # same dark color, kept consistent

flutter:
  uses-material-design: true
  assets:
    # New — first bundled in-app image asset. The app icon/splash were already handled by a
    # separate mechanism (flutter_launcher_icons/flutter_native_splash), but this is genuinely
    # different: this is a real, regular bundled image shown inside a normal screen, which
    # needed a proper assets declaration that never existed before.
    - assets/images/
    - assets/images/guddi/     # Guddi poses for the first-deed onboarding tour

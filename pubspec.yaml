name: acha_karo
description: "Acha Karo — do good, get seen."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1       # Fraunces / Inter / IBM Plex Mono / Noto Nastaliq Urdu
  image_picker: ^1.1.2       # native camera capture for photo-mode deed submissions
  geolocator: ^12.0.0        # native GPS capture (photo mode flagging logic)
  provider: ^6.1.2           # app-wide state, analogous to the useAppState() hook in the Next.js port
  supabase_flutter: ^2.5.0  # if flutter pub get fails mentioning "publishableKey" instead of
                              # "anonKey", that's Supabase's own recent parameter rename — one
                              # line to fix in lib/main.dart, tell me and I'll adjust it
  url_launcher: ^6.3.0      # opens campaign YouTube videos externally — youtube_player_flutter
                              # (in-app playback) was removed: it depends on flutter_inappwebview,
                              # which has a currently-unresolved upstream bug breaking the Android
                              # build entirely on newer build tools. Not worth the risk for MVP.
  permission_handler: ^11.4.4  # Runtime permissions for camera, location, storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1  # generates every required icon size from one image you provide
  flutter_native_splash: ^2.4.1    # generates the real native launch screen (background color +
                                      # logo) from the config below — replaces Flutter's default
                                      # white screen shown before Flutter itself has loaded

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#081209"          # matches AppColors.bg1 — same dark background the app itself uses,
                              # not the default white
  image: "assets/splash/logo.png"
  android_12:                # Android 12+ uses a different splash API, needs its own config —
    color: "#081209"         # same dark color, kept consistent

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

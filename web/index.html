  <script id="ak-install-script">
    // "Add to Home Screen" prompt. Pure JS in web/index.html, so it only ever exists in the web
    // build, never the Android APK. No network calls, no analytics, no personal data — the only
    // thing stored is a "Not now" timestamp in localStorage so people aren't nagged.
    (function () {
      var DISMISS_KEY = 'ak_install_dismissed_at';
      var REOFFER_MS = 7 * 24 * 60 * 60 * 1000; // re-offer after 7 days
      var SHOW_DELAY_MS = 8000; // after the page has loaded AND the person has interacted

      function isStandalone() {
        try {
          return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        } catch (e) {
          return false;
        }
      }
      function recentlyDismissed() {
        try {
          var t = parseInt(window.localStorage.getItem(DISMISS_KEY) || '0', 10);
          return t > 0 && Date.now() - t < REOFFER_MS;
        } catch (e) {
          return false;
        }
      }
      function rememberDismiss() {
        try {
          window.localStorage.setItem(DISMISS_KEY, String(Date.now()));
        } catch (e) {}
      }

      if (isStandalone()) return;

      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      // In-app browsers (Instagram, TikTok, Facebook, Snapchat, etc.) and Android WebViews can't
      // install a web app at all — the best we can do there is point people to a real browser.
      var isInApp = /FBAN|FBAV|FB_IAB|Instagram|TikTok|musical_ly|BytedanceWebview|Snapchat|Line\/|LinkedInApp|Twitter|GSA\/|; wv\)/i.test(ua);

      var deferredPrompt = null;
      var ready = false;
      var banner = null;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); // hold Chrome's own mini-infobar; we show our banner at a better moment
        deferredPrompt = e;
        maybeShow();
      });
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        hide();
      });

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function shareIcon() {
        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('class', 'ak-share');
        svg.setAttribute('aria-label', 'Share');
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M12 3l-4 4h3v8h2V7h3l-4-4zM5 10v10h14V10h-3v2h1v6H7v-6h1v-2H5z');
        path.setAttribute('fill', '#D9A62E');
        svg.appendChild(path);
        return svg;
      }

      function build(mode) {
        var root = el('div');
        root.id = 'ak-install';
        root.setAttribute('role', 'region');
        root.setAttribute('aria-label', 'Add Acha Karo to your home screen');

        var icon = el('img');
        icon.src = 'icons/Icon-192.png?v=1.3-logo';
        icon.alt = '';
        root.appendChild(icon);

        var text = el('div', 'ak-text');
        text.appendChild(el('span', 'ak-title', 'Add Acha Karo to your home screen'));
        var sub = el('span', 'ak-sub');
        if (mode === 'prompt') {
          sub.textContent = 'Open it in one tap, like an app.';
        } else if (mode === 'ios') {
          sub.appendChild(document.createTextNode('Tap '));
          sub.appendChild(shareIcon());
          sub.appendChild(document.createTextNode(' Share, then “Add to Home Screen”.'));
        } else {
          sub.textContent = isIOS
            ? 'Open this page in Safari to install it.'
            : 'Open this page in Chrome to install it.';
        }
        text.appendChild(sub);
        root.appendChild(text);

        var actions = el('div', 'ak-actions');
        if (mode === 'prompt') {
          var install = el('button', 'ak-primary', 'Install');
          install.type = 'button';
          install.addEventListener('click', function () {
            var p = deferredPrompt;
            deferredPrompt = null;
            hide();
            if (!p) return;
            try {
              var shown = p.prompt();
              if (shown && shown.catch) shown.catch(function () {});
            } catch (e) {
              return;
            }
            if (p.userChoice && p.userChoice.then) {
              p.userChoice.then(function (choice) {
                if (!choice || choice.outcome !== 'accepted') rememberDismiss();
              }, function () {});
            }
          });
          actions.appendChild(install);
        }
        var notNow = el('button', 'ak-secondary', 'Not now');
        notNow.type = 'button';
        notNow.addEventListener('click', function () {
          rememberDismiss();
          hide();
        });
        actions.appendChild(notNow);
        root.appendChild(actions);
        return root;
      }

      function currentMode() {
        if (deferredPrompt) return 'prompt';
        if (isInApp) return 'inapp';
        if (isIOS) return 'ios';
        return null; // e.g. desktop Firefox, or Chrome before it has decided the app is installable
      }

      function maybeShow() {
        if (!ready || banner || isStandalone() || recentlyDismissed()) return;
        var mode = currentMode();
        if (!mode || !document.body) return;
        banner = build(mode);
        document.body.appendChild(banner);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            if (banner) banner.classList.add('ak-show');
          });
        });
      }

      function hide() {
        if (!banner) return;
        var b = banner;
        banner = null;
        b.classList.remove('ak-show');
        setTimeout(function () {
          if (b.parentNode) b.parentNode.removeChild(b);
        }, 250);
      }

      // Never on first paint: wait for the page to finish loading AND for the person's first
      // interaction (tap/key), then a short delay — so it doesn't jump in during the splash or
      // the moment someone lands.
      function onFirstInteraction() {
        window.removeEventListener('pointerdown', onFirstInteraction, true);
        window.removeEventListener('keydown', onFirstInteraction, true);
        setTimeout(function () {
          ready = true;
          maybeShow();
        }, SHOW_DELAY_MS);
      }
      function armAfterLoad() {
        window.addEventListener('pointerdown', onFirstInteraction, true);
        window.addEventListener('keydown', onFirstInteraction, true);
      }
      if (document.readyState === 'complete') {
        armAfterLoad();
      } else {
        window.addEventListener('load', armAfterLoad);
      }
    })();
  </script>
